name: CI

# Manual only: run it from the Actions tab (or `gh workflow run ci.yml --ref <branch>`).
on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Packaging smoke test
        shell: bash
        run: |
          cargo build --release -p spunkpipe -p spunkpipe-tray
          case "$RUNNER_OS" in
            Windows) target=x86_64-pc-windows-msvc ;;
            macOS)   target=aarch64-apple-darwin ;;
            *)       target=x86_64-unknown-linux-musl ;;
          esac
          scripts/package.sh 0.0.0 "$target" target/release dist
          ls -l dist
